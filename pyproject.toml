[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-codex-desktop"
version = "0.1.0"
description = "A native Linux client for the Codex app server"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.scripts]
mint-codex = "mint_codex.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
